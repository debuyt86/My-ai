<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unrestricted AI</title>
    <style>
        :root {
            --bg-color: #ffffff; --sidebar-bg: #f9f9fb; --text-main: #111827; --text-muted: #6b7280;
            --border-color: #e5e7eb; --primary-blue: #3b82f6; --input-bg: #f3f4f6; --hover-bg: #e5e7eb;
            --user-msg-bg: #eff6ff; --bot-msg-bg: #f9fafb;
        }
        body.dark-mode {
            --bg-color: #111827; --sidebar-bg: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af;
            --border-color: #374151; --primary-blue: #3b82f6; --input-bg: #374151; --hover-bg: #4b5563;
            --user-msg-bg: #1e3a8a; --bot-msg-bg: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1rem; transition: background-color 0.3s; }
        .new-chat-btn, .menu-btn { background-color: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: 9999px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .menu-btn { background: none; border: none; border-radius: 8px; }
        .sidebar-spacer { flex: 1; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .greeting-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #3b82f6); border-radius: 16px; margin-bottom: 1.5rem; }
        .greeting-area h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Chat Box */
        .chat-box { flex: 1; overflow-y: auto; padding: 2rem; display: none; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
        .message-row { display: flex; width: 100%; max-width: 800px; margin: 0 auto; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }
        .message-bubble { max-width: 80%; padding: 1rem 1.5rem; border-radius: 20px; font-size: 1rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user .message-bubble { background-color: var(--user-msg-bg); color: var(--text-main); border-bottom-right-radius: 4px; border: 1px solid var(--primary-blue); }
        .bot .message-bubble { background-color: var(--bot-msg-bg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }

        /* Input Area */
        .input-wrapper { padding: 1rem 2rem 2rem 2rem; max-width: 800px; margin: 0 auto; width: 100%; }
        #file-preview { display: none; align-items: center; font-size: 0.85rem; color: var(--primary-blue); margin-bottom: 0.5rem; margin-left: 1.5rem; font-weight: 500; }
        .input-box { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 9999px; padding: 0.5rem 0.5rem 0.5rem 1.25rem; gap: 0.5rem; border: 1px solid var(--border-color); }
        .upload-label { cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: 50%; transition: background-color 0.2s, color 0.2s; }
        .upload-label:hover { background-color: var(--hover-bg); color: var(--text-main); }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; color: var(--text-main); padding: 0.5rem 0; }
        .send-btn { background-color: var(--primary-blue); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .disclaimer { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem; }

        @media (max-width: 768px) { .sidebar { display: none; } .input-wrapper { padding: 1rem; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
        <div class="sidebar-spacer"></div>
        <button class="menu-btn" id="theme-toggle">🌙 <span id="theme-text">Dark Mode</span></button>
    </aside>

    <main class="main-content">
        <div class="greeting-area" id="greeting-area">
            <div class="logo-icon"></div>
            <h1>Hello, User</h1>
            <p>How can I help you today?</p>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="input-wrapper">
            <div id="file-preview">📄 <span id="file-name"></span></div>
            <div class="input-box">
                <input type="file" id="file-upload" style="display: none;">
                <label for="file-upload" class="upload-label" title="Upload File">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </label>
                <input type="text" class="chat-input" id="chat-input" placeholder="Ask anything to Dolphin Uncensored...">
                <button class="send-btn" id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <p class="disclaimer">Dolphin Uncensored AI. Responses are unrestricted.</p>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            // ==========================================
            // API CONFIGURATION (SECURE SPLIT METHOD)
            // ==========================================
            // GitHub bot se bachne ke liye key ko 2 hisson mein baant diya hai
            const part1 = "sk-or-v1-";
            const part2 = "1a98a307ab06d4a1f90782146935bcf5c3e4eb24c05f7550fc0e163f843a0514";
            const API_KEY = part1 + part2; 
            
            const API_URL = "https://openrouter.ai/api/v1/chat/completions";
            const MODEL_NAME = "cognitivecomputations/dolphin-mistral-24b-venice-edition:free"; 
            // ==========================================

            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeText = document.getElementById('theme-text');
            const sendBtn = document.getElementById('send-btn');
            const chatInput = document.getElementById('chat-input');
            const greetingArea = document.getElementById('greeting-area');
            const chatBox = document.getElementById('chat-box');
            const fileUpload = document.getElementById('file-upload');
            const filePreview = document.getElementById('file-preview');
            const fileNameDisplay = document.getElementById('file-name');

            let chatHistory = [];

            themeToggleBtn.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                themeText.textContent = document.body.classList.contains('dark-mode') ? 'Light Mode' : 'Dark Mode';
            });

            fileUpload.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    fileNameDisplay.textContent = file.name;
                    filePreview.style.display = 'flex';
                } else {
                    filePreview.style.display = 'none';
                }
            });

            function appendMessage(sender, text, id = null) {
                const row = document.createElement('div');
                row.className = 'message-row ' + (sender === 'user' ? 'user' : 'bot');
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                if(id) bubble.id = id;
                bubble.textContent = text;
                
                row.appendChild(bubble);
                chatBox.appendChild(row);
                chatBox.scrollTop = chatBox.scrollHeight;
                return bubble;
            }

            function updateMessage(id, newText) {
                const bubble = document.getElementById(id);
                if (bubble) {
                    bubble.textContent = newText;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }

            async function handleSend() {
                let messageText = chatInput.value.trim();
                const file = fileUpload.files[0];

                if (!messageText && !file) return;

                chatInput.disabled = true;
                sendBtn.disabled = true;

                if (file) {
                    messageText = messageText ? messageText + `\n[File Attached: ${file.name}]` : `[File Attached: ${file.name}]`;
                }

                greetingArea.style.display = 'none';
                chatBox.style.display = 'flex';

                appendMessage('user', messageText);
                chatHistory.push({ role: "user", content: messageText });

                chatInput.value = '';
                fileUpload.value = '';
                filePreview.style.display = 'none';

                const botBubbleId = 'bot-msg-' + Date.now();
                appendMessage('bot', "Typing...", botBubbleId);

                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${API_KEY}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href, 
                            "X-Title": "My Uncensored AI App" 
                        },
                        body: JSON.stringify({
                            model: MODEL_NAME,
                            messages: chatHistory
                        })
                    });

                    const data = await response.json();

                    if (data.choices && data.choices.length > 0) {
                        const aiResponseText = data.choices[0].message.content;
                        updateMessage(botBubbleId, aiResponseText);
                        chatHistory.push({ role: "assistant", content: aiResponseText });
                    } else if (data.error) {
                        updateMessage(botBubbleId, "Error: " + data.error.message);
                    } else {
                        updateMessage(botBubbleId, "API se koi response nahi aaya.");
                    }

                } catch (error) {
                    console.error("Fetch Error:", error);
                    updateMessage(botBubbleId, "Network error. Please check API Key or internet connection.");
                } finally {
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    chatInput.focus();
                }
            }

            sendBtn.addEventListener('click', handleSend);
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSend();
            });

        })();
    </script>
</body>
</html>
