<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f9f9fb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary-blue: #3b82f6;
            --input-bg: #f3f4f6;
            --hover-bg: #e5e7eb;
            --user-msg-bg: #eff6ff;
            --bot-msg-bg: #f9fafb;
        }

        body.dark-mode {
            --bg-color: #111827;
            --sidebar-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --primary-blue: #3b82f6;
            --input-bg: #374151;
            --hover-bg: #4b5563;
            --user-msg-bg: #1e3a8a;
            --bot-msg-bg: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 1rem;
            transition: background-color 0.3s;
        }
        .new-chat-btn, .menu-btn {
            background-color: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0.75rem 1rem;
            border-radius: 9999px; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
        }
        .menu-btn { background: none; border: none; border-radius: 8px; }
        .sidebar-spacer { flex: 1; }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* Greeting Area */
        .greeting-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem; text-align: center;
        }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #a855f7, #3b82f6); border-radius: 16px; margin-bottom: 1.5rem; }
        .greeting-area h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Chat Box (New Area for messages) */
        .chat-box {
            flex: 1; overflow-y: auto; padding: 2rem; display: none; flex-direction: column; gap: 1.5rem;
        }
        .message-row { display: flex; width: 100%; max-width: 800px; margin: 0 auto; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }
        
        .message-bubble {
            max-width: 80%; padding: 1rem 1.5rem; border-radius: 20px; font-size: 1rem; line-height: 1.5;
        }
        .user .message-bubble { background-color: var(--user-msg-bg); color: var(--text-main); border-bottom-right-radius: 4px; border: 1px solid var(--primary-blue); }
        .bot .message-bubble { background-color: var(--bot-msg-bg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }

        /* Input Area */
        .input-wrapper { padding: 1rem 2rem 2rem 2rem; max-width: 800px; margin: 0 auto; width: 100%; }
        .input-box {
            display: flex; align-items: center; background-color: var(--input-bg);
            border-radius: 9999px; padding: 0.5rem 0.5rem 0.5rem 1.25rem; gap: 0.5rem; border: 1px solid var(--border-color);
        }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; color: var(--text-main); padding: 0.5rem 0; }
        .send-btn { background-color: var(--primary-blue); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .disclaimer { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem; }
        #file-preview { display: none; align-items: center; font-size: 0.85rem; color: var(--primary-blue); margin-bottom: 0.5rem; margin-left: 1.5rem; font-weight: 500; }

        @media (max-width: 768px) { .sidebar { display: none; } .input-wrapper { padding: 1rem; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
        <div class="sidebar-spacer"></div>
        <button class="menu-btn" id="theme-toggle">🌙 <span id="theme-text">Dark Mode</span></button>
    </aside>

    <main class="main-content">
        <div class="greeting-area" id="greeting-area">
            <div class="logo-icon"></div>
            <h1>Hello, User</h1>
            <p>How can I help you today?</p>
        </div>

        <div class="chat-box" id="chat-box">
            </div>

        <div class="input-wrapper">
            <div id="file-preview">📄 <span id="file-name"></span></div>
            <div class="input-box">
                <input type="text" class="chat-input" id="chat-input" placeholder="Ask anything...">
                <button class="send-btn" id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <p class="disclaimer">AI can make mistakes. Check important info.</p>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeText = document.getElementById('theme-text');
            const sendBtn = document.getElementById('send-btn');
            const chatInput = document.getElementById('chat-input');
            const greetingArea = document.getElementById('greeting-area');
            const chatBox = document.getElementById('chat-box');

            // Dark Mode
            themeToggleBtn.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                themeText.textContent = document.body.classList.contains('dark-mode') ? 'Light Mode' : 'Dark Mode';
            });

            // Add Message to Screen
            function appendMessage(sender, text) {
                const row = document.createElement('div');
                row.className = 'message-row ' + (sender === 'user' ? 'user' : 'bot');
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                
                row.appendChild(bubble);
                chatBox.appendChild(row);
                
                // Scroll to bottom
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // Send Button Logic
            function handleSend() {
                const message = chatInput.value.trim();
                if (!message) return;

                // Hide greeting, show chat box
                greetingArea.style.display = 'none';
                chatBox.style.display = 'flex';

                // 1. Show User Message
                appendMessage('user', message);
                chatInput.value = '';

                // 2. Simulate Bot Typing Delay (1.5 seconds)
                setTimeout(function() {
                    appendMessage('bot', "Main ek dummy AI hoon. Abhi mere piche koi real database ya API connect nahi hai. Par aapka frontend bilkul perfect kaam kar raha hai!");
                }, 1500);
            }

            sendBtn.addEventListener('click', handleSend);
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleSend();
            });

        })();
    </script>
</body>
</html>
